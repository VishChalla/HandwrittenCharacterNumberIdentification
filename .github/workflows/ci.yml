name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Image preparation is tested without TensorFlow so CI stays fast.
      - run: pip install numpy pillow pytest
      - run: pytest -q
